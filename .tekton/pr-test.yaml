---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pr-test
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[pac-poc-20261125]"
spec:
  pipelineRef:
    resolver: cluster
    params:
    - name: kind
      value: pipeline
    - name: name
      value: backend-pipeline
    - name: namespace
      value: helm-env-dev-20261124
  taskRunTemplate:
    serviceAccountName: pac-pr-ci
    podTemplate:
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        fsGroup: 65532
  params:
  - name: git-url
    value: "{{ repo_url }}"
  - name: git-revision
    value: "{{ revision }}"
  - name: git-ref
    value: refs/pull/{{ pull_request_number }}/head
  - name: update-manifest-enabled
    value: 'false'
  workspaces:
  - name: shared-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  - name: maven-cache
    emptyDir: {}
